name: Refresh profile activity

on:
  schedule:
    - cron: '17 5 * * *' # 06:17 Africa/Lagos (UTC+1)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check private stats credential
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: |
          if [ -z "$PROFILE_STATS_TOKEN" ]; then
            echo '::error::Add PROFILE_STATS_TOKEN with read:user. Previous artwork is retained.'
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Generate aggregate cards
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python tools/update_activity.py --output generated
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: AssilBelhouen
          github_token: ${{ secrets.PROFILE_STATS_TOKEN }}
          outputs: |
            generated/activity-snake.svg?color_snake=%2300B86B&color_dots=%23E8F5EC,%23B6E8C8,%237BDAA2,%233AC77B,%23008A4B
            generated/activity-snake-dark.svg?palette=github-dark&color_snake=%2300FF88&color_dots=%23131F17,%2320442F,%232C8050,%233EBE73,%2300FF88
      - name: Publish only complete successful output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: bash tools/publish_activity.sh
